<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kan Davası">
<title>Masa Tenisi Kan Davası</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"
        integrity="sha384-WmjsOVSSw3JNqIKfmDU35+uddOzBdP9PlYIWCg7xdnVOesjWVGpRcooOVheFFwH4"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="config.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
<script type="module" src="salon.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Chivo:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --void:#05080a; --panel:#0c1216; --court:#010305; --rule:#17232a;
  --ink:#e9f2f4; --dim:#7d949d; --faint:#455861; --bad:#ff4242;
  --disp:"Big Shoulders Display","Archivo Narrow","Arial Narrow",sans-serif;
  --body:"Chivo",system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,monospace;
  --cam:rgba(6,9,12,.62);
}
*{box-sizing:border-box}
html,body{height:100%; overflow:hidden; overscroll-behavior:none}
body{margin:0; background:var(--void); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
#salon{position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:0; touch-action:none}
#yukleme{position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:var(--void); transition:opacity .7s ease}
#yukleme.bitti{opacity:0; pointer-events:none}
#yukleme .b{width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 33% 30%, #ffb184, #ff6a1f 62%, #b8400c); box-shadow:0 0 22px rgba(255,106,31,.5); animation:zipla 1s cubic-bezier(.3,0,.6,1) infinite alternate}
@keyframes zipla{from{transform:translateY(-14px)} to{transform:translateY(10px)}}
#yukleme p{font-family:var(--mono); font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); margin:0}

/* ---------- HUD ---------- */
.hud{position:fixed; inset:0; z-index:2; pointer-events:none}
.hud > *{pointer-events:auto}
.bar{position:absolute; left:0; right:0; top:0; display:flex; align-items:center; gap:10px; padding:12px 16px; padding-top:max(12px, env(safe-area-inset-top))}
.logo{display:flex; align-items:center; gap:9px; margin-right:auto; text-decoration:none; color:var(--ink)}
.logo .b{width:14px; height:14px; border-radius:50%; background:radial-gradient(circle at 33% 30%, #ffb184, #ff6a1f 62%, #b8400c); box-shadow:0 0 14px rgba(255,106,31,.5)}
.logo h1{font-family:var(--disp); font-weight:800; text-transform:uppercase; font-size:19px; letter-spacing:.02em; margin:0; line-height:1; text-shadow:0 2px 12px rgba(0,0,0,.6)}
.sekmeler{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; max-width:60vw}
.sekmeler::-webkit-scrollbar{display:none}
.sekme,.ikon{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  background:var(--cam); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.12); border-radius:3px;
  color:var(--dim); padding:8px 11px; cursor:pointer; white-space:nowrap; transition:color .15s, border-color .15s;
}
.sekme:hover,.ikon:hover{color:var(--ink)}
.sekme[aria-current="true"]{color:var(--ink); border-color:rgba(255,255,255,.5)}
select.who{font:inherit; font-family:var(--mono); font-size:11px; color:var(--ink); background:var(--cam); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.12); border-radius:3px; padding:7px 8px}

.geri{position:absolute; left:16px; top:64px; display:none}
.has-view .geri{display:inline-block}
.ipucu{position:absolute; left:50%; bottom:max(22px, env(safe-area-inset-bottom)); transform:translateX(-50%); font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.55); text-shadow:0 1px 8px rgba(0,0,0,.7); pointer-events:none}
.has-view .ipucu{display:none}

/* skor kontrolleri: masa görünümünde altta */
.kontrol{position:absolute; left:0; right:0; bottom:max(18px, env(safe-area-inset-bottom)); display:none; align-items:flex-end; justify-content:space-between; gap:12px; padding:0 16px}
.has-view .kontrol{display:flex}
.taraf{display:flex; flex-direction:column; align-items:flex-start; gap:8px; min-width:0}
.taraf.r{align-items:flex-end}
.taraf .ad{font-family:var(--mono); font-size:10px; letter-spacing:.22em; text-transform:uppercase; text-shadow:0 1px 8px rgba(0,0,0,.8)}
.taraf .skor{
  font-family:var(--disp); font-weight:800; font-size:clamp(44px,9vw,84px); line-height:.86; color:#fff;
  background:none; border:none; padding:0 4px; cursor:text; text-shadow:0 2px 18px rgba(0,0,0,.75); font-variant-numeric:tabular-nums;
}
.taraf .skor:hover{outline:1px dashed rgba(255,255,255,.35); border-radius:4px}
.taraf .tuslar{display:flex; gap:8px}
.plus{
  font-family:var(--disp); font-weight:700; text-transform:uppercase; font-size:21px; letter-spacing:.06em; line-height:1;
  padding:15px 22px; border-radius:3px; cursor:pointer; background:var(--cam); backdrop-filter:blur(10px); border:1.5px solid; color:inherit;
  white-space:nowrap; box-shadow:0 6px 24px rgba(0,0,0,.45); transition:background .15s, color .15s, transform .08s;
}
.plus:active{transform:translateY(1px)}
.plus:disabled{opacity:.4; cursor:not-allowed}
.eksi{font-family:var(--disp); font-weight:700; font-size:21px; line-height:1; padding:15px 14px; border-radius:3px; cursor:pointer; background:var(--cam); backdrop-filter:blur(10px); border:1.5px solid rgba(255,255,255,.2); color:var(--dim)}
.eksi:hover{color:var(--ink)}
.eksi:disabled{opacity:.35; cursor:not-allowed}
.orta{display:flex; flex-direction:column; align-items:center; gap:6px; align-self:flex-end; padding-bottom:6px}
.orta .yol{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.55); text-shadow:0 1px 8px rgba(0,0,0,.8); text-align:center}
.undo{background:none; border:none; color:rgba(255,255,255,.5); cursor:pointer; font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; padding:2px 4px; text-shadow:0 1px 8px rgba(0,0,0,.8)}
.undo:hover{color:#fff}
.undo:disabled{opacity:.3; cursor:not-allowed}

/* manşet: sayı gelince ortada büyük laf */
.manset{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:0 5vw; pointer-events:none; text-align:center}
.manset span{
  display:block; max-width:92vw; font-family:var(--disp); font-weight:800; text-transform:uppercase; line-height:.9;
  font-size:clamp(34px,7.2vw,104px); letter-spacing:.005em; text-wrap:balance;
  text-shadow:0 0 30px rgba(0,0,0,.9), 0 4px 0 rgba(0,0,0,.6);
}
.manset i{display:inline-block; font-style:normal; margin:0 .22em; opacity:0; transform:translateY(40px) rotate(-6deg) scale(.7); animation:vur 2.8s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes vur{
  0%{opacity:0; transform:translateY(40px) rotate(-6deg) scale(.7)}
  9%{opacity:1; transform:translateY(0) rotate(0) scale(1.06)}
  14%{transform:scale(1)}
  82%{opacity:1; transform:translateY(0) scale(1)}
  100%{opacity:0; transform:translateY(-30px) scale(1.04)}
}
.manset .alt{position:absolute; left:50%; top:calc(50% + clamp(34px,7.2vw,104px)*.75); transform:translateX(-50%); font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.6); opacity:0; animation:altyazi 2.8s ease both; white-space:nowrap}
@keyframes altyazi{0%,12%{opacity:0} 22%,80%{opacity:1} 100%{opacity:0}}
.flas{position:absolute; inset:0; pointer-events:none; opacity:0; background:radial-gradient(ellipse at center, rgba(255,255,255,.28), transparent 60%); animation:flas .5s ease-out both}
@keyframes flas{0%{opacity:0} 15%{opacity:1} 100%{opacity:0}}

/* istatistik çekmecesi */
.perde{position:absolute; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .25s}
.perde.acik{opacity:1; pointer-events:auto}
.cekmece{
  position:absolute; left:0; right:0; bottom:0; max-height:88vh; overflow-y:auto; transform:translateY(102%);
  transition:transform .32s cubic-bezier(.2,.8,.3,1); background:rgba(8,12,15,.94); backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.12); border-radius:14px 14px 0 0; padding:18px 18px 40px;
}
.cekmece.acik{transform:none}
.cekmece .ic{max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:26px}
.cekmece .tutamac{width:44px; height:4px; border-radius:2px; background:rgba(255,255,255,.25); margin:0 auto 4px}
.eyebrow{font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); margin:0 0 14px}
.lower{display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1fr); gap:34px}
.note{border:1px solid var(--rule); border-left:2px solid #ff6a1f; background:var(--panel); padding:13px 15px; border-radius:3px; font-size:13.5px; color:var(--dim); line-height:1.55}
.note b{color:var(--ink); font-weight:600}
.empty{color:var(--faint); font-family:var(--mono); font-size:12px; padding:16px 0}
.addp{background:none; border:1px dashed var(--rule); color:var(--faint); cursor:pointer; font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; padding:8px 12px; border-radius:2px}
.addp:hover{color:var(--ink); border-color:var(--faint)}
.foot{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin-top:14px; padding-top:14px; border-top:1px solid var(--rule)}
.foot .note{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--faint); margin:0; border:none; background:none; padding:0}
.bildirim{position:absolute; left:50%; top:70px; transform:translateX(-50%); background:var(--cam); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.15); border-radius:3px; padding:9px 14px; font-family:var(--mono); font-size:11.5px; color:var(--ink); opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center}
.bildirim.goster{opacity:1}
@media (max-width:720px){
  .lower{grid-template-columns:1fr; gap:26px}
  .sekmeler{max-width:50vw}
  .plus{font-size:17px; padding:14px 14px}
  .taraf .skor{font-size:clamp(40px,12vw,64px)}
}
@media (prefers-reduced-motion:reduce){ .manset i{animation-duration:2.2s} .cekmece{transition:none} }

/* ---------- yüzler ---------- */
.face{
  position:relative; border-radius:50%; overflow:hidden; flex:none;
  display:block; line-height:0; isolation:isolate;
}
.face img{
  width:100%; height:100%; object-fit:cover; display:block;
  filter:grayscale(1) contrast(1.3) brightness(.95) url(#poster);
  mix-blend-mode:multiply;
}
.face::after{
  content:""; position:absolute; inset:0; border-radius:50%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
}
.face.has::after{
  background:radial-gradient(circle at 50% 47%, rgba(0,0,0,0) 46%, rgba(0,0,0,.88) 99%);
}
.who-row{display:flex; align-items:center; gap:9px; min-width:0}
.pl.r .who-row{flex-direction:row-reverse}
.face.court{width:30px; height:30px}
.face.row{width:38px; height:38px}
.addphoto{
  background:none; border:1px solid var(--rule); border-radius:2px; cursor:pointer;
  color:var(--faint); font-family:var(--mono); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; padding:4px 7px; margin-left:10px; white-space:nowrap;
}
.addphoto:hover{color:#ff6a1f; border-color:#ff6a1f}
.face.drop{outline:2px dashed #ff6a1f; outline-offset:2px}
.photohint{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; color:var(--faint);
  margin:12px 0 0; line-height:1.6;
}
button.face{cursor:pointer; border:none; padding:0; background:transparent}
button.face:hover{opacity:.82}
.face .initial{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--disp); font-weight:800; font-size:15px; color:#05080a; line-height:1;
}
.face.row .initial{font-size:14px}

/* ---------- fotoğraf kırpma ---------- */
.cropper{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background:rgba(3,6,8,.86); padding:20px;
}
.cropper[hidden]{display:none}
.cropbox{
  background:var(--panel); border:1px solid var(--rule); border-radius:5px;
  padding:20px; display:flex; flex-direction:column; gap:14px; align-items:center;
  max-width:100%;
}
.cropview{position:relative; width:260px; height:260px; max-width:70vw; touch-action:none; cursor:grab}
.cropview:active{cursor:grabbing}
.cropview canvas{width:100%; height:100%; display:block; background:var(--court); border-radius:3px}
.cropview .ring{
  position:absolute; inset:0; border-radius:50%; pointer-events:none;
  box-shadow:0 0 0 999px rgba(5,8,10,.72), inset 0 0 0 1px rgba(255,255,255,.5);
}
.cropper input[type=range]{width:260px; max-width:70vw; accent-color:#ff6a1f}
.croprow{display:flex; gap:10px}
.btn{
  font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  padding:10px 16px; border-radius:2px; cursor:pointer;
  background:#ff6a1f; color:#05080a; border:1px solid #ff6a1f; font-weight:500;
}
.btn.ghost{background:transparent; color:var(--dim); border-color:var(--rule)}
.btn.ghost:hover{color:var(--ink); border-color:var(--faint)}

/* ---------- grafikler ---------- */
.kartlar{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px}
.oyuncuKart{
  background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:16px;
  display:flex; flex-direction:column; gap:12px;
}
.oyuncuKart .ust{display:flex; align-items:center; gap:11px}
.oyuncuKart .ad{font-family:var(--disp); font-weight:700; font-size:24px; text-transform:uppercase; letter-spacing:.02em}
.oyuncuKart .buyuk{font-family:var(--disp); font-weight:800; font-size:44px; line-height:.9; font-variant-numeric:tabular-nums}
.oyuncuKart .alt{display:flex; gap:16px; font-family:var(--mono); font-size:10.5px; color:var(--faint); letter-spacing:.1em; text-transform:uppercase}
.oyuncuKart .alt b{display:block; font-family:var(--disp); font-size:19px; color:var(--ink); letter-spacing:.02em; margin-top:2px}
.oran{height:6px; border-radius:3px; background:var(--court); overflow:hidden}
.oran i{display:block; height:100%; border-radius:3px; transition:width .5s cubic-bezier(.2,.8,.3,1)}

.grafik{background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:18px}
.grafik svg{display:block; width:100%; height:auto; overflow:visible}
.gLegend{display:flex; flex-wrap:wrap; gap:14px; margin-top:12px; font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.gLegend span{display:flex; align-items:center; gap:7px}
.gLegend i{width:14px; height:2px; border-radius:1px}

.h2h{display:flex; flex-direction:column; gap:12px}
.h2hSatir{background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:14px 16px; display:flex; flex-direction:column; gap:9px; cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit}
.h2hSatir:hover{border-color:var(--faint)}
.h2hUst{display:flex; align-items:center; justify-content:space-between; gap:12px}
.h2hAd{font-family:var(--disp); font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:.02em; display:flex; align-items:center; gap:8px}
.h2hSkor{font-family:var(--disp); font-weight:800; font-size:24px; font-variant-numeric:tabular-nums; letter-spacing:.02em}
.h2hCubuk{height:8px; border-radius:4px; display:flex; overflow:hidden; background:var(--court)}
.h2hCubuk i{display:block; height:100%}
.h2hAlt{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}

/* ---------- tabela / feed / döküm ---------- */
.lower{display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1fr); gap:34px}
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
th{
  font-family:var(--mono); font-weight:500; font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); text-align:right;
  padding:0 0 8px; border-bottom:1px solid var(--rule);
}
th:first-child{text-align:left}
td{padding:10px 0; border-bottom:1px solid rgba(23,35,42,.6); text-align:right; font-size:14px}
td:first-child{text-align:left}
.nmcell{display:flex; align-items:center; gap:9px; font-family:var(--disp); font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:.03em}
.swatch{width:9px; height:9px; border-radius:2px; flex:none}
tr.me td{color:#fff}
.streak{font-family:var(--mono); font-size:11px; padding:2px 6px; border:1px solid currentColor; border-radius:2px}
.streak.up{color:#4ef0a0} .streak.dn{color:#ff6a6a} .streak.no{color:var(--faint)}

.feed{display:flex; flex-direction:column}
.ev{display:grid; grid-template-columns:1fr auto; gap:3px 12px; padding:12px 0; border-bottom:1px solid rgba(23,35,42,.6)}
.ev:first-child{border-top:1px solid var(--rule)}
.ev-t{font-family:var(--disp); font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:.03em}
.ev-t .beat{color:var(--faint)}
.ev-w{font-family:var(--mono); font-size:10.5px; color:var(--faint); white-space:nowrap; display:flex; align-items:center; gap:8px}
.ev-talk{grid-column:1/-1; font-family:var(--mono); font-size:12px; color:var(--dim); line-height:1.5}
.rm{background:none; border:none; color:var(--faint); cursor:pointer; padding:0 2px; font-size:12px; line-height:1}
.rm:hover{color:var(--bad)}

.daily{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:26px}
.dcard{border:1px solid var(--rule); border-radius:3px; padding:15px 16px; background:var(--panel)}
.dhead{font-family:var(--disp); font-weight:700; font-size:20px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:12px; display:flex; align-items:center; gap:8px}
.dcard td,.dcard th{font-size:13px; padding:6px 0}
.dcard td:first-child{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
tr.carry td{color:var(--faint)}
tr.sum td{border-bottom:none; font-family:var(--disp); font-weight:700; font-size:19px; padding-top:9px}
tr.sum td:first-child{font-family:var(--mono); font-size:10.5px; color:var(--dim)}

.note{
  border:1px solid var(--rule); border-left:2px solid #ff6a1f; background:var(--panel);
  padding:13px 15px; border-radius:3px; font-size:13.5px; color:var(--dim); line-height:1.55;
}
.note b{color:var(--ink); font-weight:600}
.empty{color:var(--faint); font-family:var(--mono); font-size:12px; padding:16px 0}
.foot{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;
  margin-top:14px; padding-top:14px; border-top:1px solid var(--rule);
}
.foot .note{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--faint); margin:0}
.addp{
  background:none; border:1px dashed var(--rule); color:var(--faint); cursor:pointer;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  padding:8px 12px; border-radius:2px; margin-top:14px;
}
.addp:hover{color:var(--ink); border-color:var(--faint)}

@media (max-width:720px){
  .lower{grid-template-columns:1fr; gap:26px}
  .riv{padding:16px 14px 14px}
  .panel{padding:16px 13px 30px}
  .bar{padding:10px 13px}
  .riv-ctrl{grid-template-columns:1fr 1fr; gap:10px}
  .mid-meta{grid-column:1/-1; order:3; margin-top:4px}
  .plus{width:100%; font-size:17px; padding:14px 10px}
  .ctrl-r{justify-content:stretch}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>

<script>
(function(){
"use strict";

var HEDEF = 100;
var PHOS = ["#ff6a1f","#2fd4ee","#ffd83d","#b98cff","#4ef0a0","#ff5d8f"];
var REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var $ = function(id){ return document.getElementById(id); };

var TRMAP = {"ç":"c","Ç":"c","ğ":"g","Ğ":"g","ı":"i","İ":"i","ö":"o","Ö":"o","ş":"s","Ş":"s","ü":"u","Ü":"u"};
function slug(s){
  return String(s).replace(/[çÇğĞıİöÖşŞüÜ]/g,function(c){return TRMAP[c];})
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function hash(s){ var h=5381,i; for(i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h; }
function key2(x,y){ return [x,y].sort().join("__"); }
function pick(pool,seed){ return pool[hash(seed)%pool.length]; }
var VOW = "aeıioöuü";
function suf(n, kind){
  var low = String(n).toLocaleLowerCase("tr");
  var vs = low.replace(/[^aeıioöuü]/g,"");
  var v = vs.charAt(vs.length-1) || "a";
  var endsVowel = VOW.indexOf(low.charAt(low.length-1)) >= 0;
  var two = {a:"a","ı":"a",o:"a",u:"a",e:"e",i:"e","ö":"e","ü":"e"}[v] || "a";
  var four = {a:"ı","ı":"ı",o:"u",u:"u",e:"i",i:"i","ö":"ü","ü":"ü"}[v] || "ı";
  if(kind === "dat") return n + "'" + (endsVowel ? "y" : "") + two;
  if(kind === "acc") return n + "'" + (endsVowel ? "y" : "") + four;
  if(kind === "gen") return n + "'" + (endsVowel ? "n" : "") + four + "n";
  return n;
}
function fill(t,v){ return t.replace(/\{(\w+)\}/g,function(m,k){ return v[k]!==undefined ? v[k] : m; }); }

/* ---------- laf ---------- */
var TOAST = {
  normal:["+1 {W}","{L} bakakaldı","al bakalım {L}","{L} yine gitti","kes sesini {L}","{W} devam ediyor","{L} raketi öpsün","yandın {L}"],
  seri:["üst üste {N} · {L} nerede?","{L} {N}. kez yedi","{N} oldu {L}, otur"],
  lider:["liderlik {Wd} geçti"],
  esit:["eşitlik · gerilim tavan"],
  mil:["{W} · {S}. galibiyet"]
};
var FEED = {
  normal:[
    "{W} bir tane daha ekledi, {L} yine seyretti.",
    "{L} yine yedi. Amına koyayım bu ne inat.",
    "{W} aldı, {L} şimdiden bahane hazırlıyor.",
    "{L} bir sayı daha hediye etti. Cömert çocuk.",
    "{W} +1. {Lg} morali bok gibi.",
    "{L} yine kaybetti, kimse şaşırmadı.",
    "{W} işini gördü. {L} raketi duvara assın."
  ],
  seri:[
    "{L} için üst üste {N}. Bu artık maç değil, abonelik.",
    "{N} maçtır kaybediyorsun {L}, adam gibi bir bahane bul bari.",
    "{N}. kez söylüyoruz {L}: {W} senin baban.",
    "{N} oldu {L}, hâlâ raket tutuyorsun. Cesaret mi aptallık mı?",
    "{Lg} serisi {N} oldu. Bu tempoyla emekliliği masada karşılar."
  ],
  lider:[
    "Liderlik {Wd} geçti. {L} şokta.",
    "{W} öne geçti. {L} artık takipçi, alışsın."
  ],
  esit:[
    "Eşitlendi. {L} nefes aldı ama geçici.",
    "Berabere kaldı. {L} bunu kutlayacak, acınası."
  ],
  mil:[
    "{W} {S}. galibiyetini aldı. {L} geride kaldı, üzücü.",
    "{S} oldu {W}. {L} için bu iş kapanıyor."
  ]
};
function catOf(m){
  if(m._mil) return "mil";
  if(m._streak >= 3) return "seri";
  if(m._flip === "lider") return "lider";
  if(m._flip === "esit") return "esit";
  return "normal";
}
function talkVars(m,wn,ln){
  return {W:wn, L:ln, N:m._streak, S:m._wTotal, SL:m._lTotal,
          Wd:suf(wn,"dat"), Ld:suf(ln,"dat"), Lg:suf(ln,"gen"), La:suf(ln,"acc")};
}
function toastFor(m,wn,ln){ return fill(pick(TOAST[catOf(m)], m.id), talkVars(m,wn,ln)); }
function feedFor(m,wn,ln){ return fill(pick(FEED[catOf(m)], m.id+"f"), talkVars(m,wn,ln)); }
function verdictFor(an,bn,aw,bw){
  var d=Math.abs(aw-bw), W=aw>bw?an:bn, L=aw>bw?bn:an;
  if(!d) return "Berabere. İkiniz de tam olarak aynı derecede vasatsınız.";
  if(d>=8) return W+", "+suf(L,"acc")+" burada evlat edinmiş.";
  if(d>=4) return W+" önde. "+L+" nefes nefese peşinde.";
  return "Kıl payı "+W+". Tek seri her şeyi değiştirir.";
}

/* ---------- state ---------- */
var S = {players:[], rivs:{}, matches:[], shared:false};
var seen = Object.create(null), primed = false, arrived = false;
var me = ""; try{ me = localStorage.getItem("mt-me")||""; }catch(e){}

function pname(id){ for(var i=0;i<S.players.length;i++) if(S.players[i].id===id) return S.players[i].name; return id; }
function pcol(id){ for(var i=0;i<S.players.length;i++) if(S.players[i].id===id) return PHOS[i%PHOS.length]; return PHOS[0]; }
function pphoto(id){ for(var i=0;i<S.players.length;i++) if(S.players[i].id===id) return S.players[i].photo||""; return ""; }

function paintFace(el, id){
  if(!el) return;
  var col = pcol(id), ph = pphoto(id), nm = pname(id);
  if(el.getAttribute("data-sig") === id + "|" + col + "|" + (ph ? ph.length : 0)) return;
  el.setAttribute("data-sig", id + "|" + col + "|" + (ph ? ph.length : 0));
  el.style.background = col;
  el.classList.toggle("has", !!ph);
  el.innerHTML = ph ? '<img src="'+esc(ph)+'" alt="">'
                    : '<span class="initial">'+esc(nm.charAt(0).toLocaleUpperCase("tr"))+'</span>';
}

function compute(){
  var ms = S.matches.slice().sort(function(a,b){ return a.at-b.at; });
  var pairs = {}, order = [];
  function ensure(a,b){
    var k = key2(a,b);
    if(!pairs[k]){
      var s = [a,b].sort();
      pairs[k] = {key:k, a:s[0], b:s[1], aw:0, bw:0, base:[0,0], ms:[]};
      order.push(k);
    }
    return pairs[k];
  }
  for(var i=0;i<S.players.length;i++)
    for(var j=i+1;j<S.players.length;j++) ensure(S.players[i].id, S.players[j].id);

  Object.keys(S.rivs).forEach(function(k){
    var d = S.rivs[k];
    if(!d || !d.a || !d.b) return;
    var r = ensure(d.a, d.b);
    r.base = (d.a === r.a) ? [d.baseA||0, d.baseB||0] : [d.baseB||0, d.baseA||0];
  });
  Object.keys(pairs).forEach(function(k){ var r=pairs[k]; r.aw=r.base[0]; r.bw=r.base[1]; });

  var run = {};
  ms.forEach(function(m){
    var r = ensure(m.w, m.l);
    var was = r.aw - r.bw;
    if(m.w === r.a) r.aw++; else r.bw++;
    var now = r.aw - r.bw;
    m._streak = (run[r.key] && run[r.key].h === m.w) ? run[r.key].n+1 : 1;
    run[r.key] = {h:m.w, n:m._streak};
    m._wTotal = (m.w === r.a) ? r.aw : r.bw;
    m._lTotal = (m.w === r.a) ? r.bw : r.aw;
    m._mil = (m._wTotal % 10 === 0) && (m._wTotal > m._lTotal);
    m._flip = (now === 0) ? "esit" : ((was <= 0 && now > 0) || (was >= 0 && now < 0)) ? "lider" : "";
    r.ms.push(m);
  });

  var rec = {};
  S.players.forEach(function(p){ rec[p.id] = {w:0,l:0,n:0,dir:0}; });
  function bump(id,f,n){ if(rec[id]) rec[id][f] += n; }
  Object.keys(pairs).forEach(function(k){
    var r = pairs[k];
    bump(r.a,"w",r.base[0]); bump(r.a,"l",r.base[1]);
    bump(r.b,"w",r.base[1]); bump(r.b,"l",r.base[0]);
  });
  ms.forEach(function(m){ bump(m.w,"w",1); bump(m.l,"l",1); });

  var desc = ms.slice().reverse();
  Object.keys(rec).forEach(function(id){
    var d=0,n=0;
    for(var i=0;i<desc.length;i++){
      var m = desc[i];
      if(m.w!==id && m.l!==id) continue;
      var v = m.w===id ? 1 : -1;
      if(!d){ d=v; n=1; } else if(d===v) n++; else break;
    }
    rec[id].dir=d; rec[id].n=n;
  });

  var have = {};
  S.players.forEach(function(p){ have[p.id] = 1; });
  var list = order.map(function(k){ return pairs[k]; })
    .filter(function(r){ return have[r.a] && have[r.b]; })
    .sort(function(x,y){ return (y.aw+y.bw)-(x.aw+x.bw); });
  return {pairs:pairs, list:list, rec:rec, desc:desc, ms:ms};
}


/* ---------- genel durum: kartlar + grafikler ---------- */
function renderKartlar(c){
  var ids = S.players.map(function(p){ return p.id; });
  $("oyuncuKartlari").innerHTML = ids.map(function(id){
    var r = c.rec[id] || {w:0,l:0,n:0,dir:0}, o = r.w + r.l, pct = o ? Math.round(r.w/o*100) : 0;
    var col = pcol(id);
    var seri = !r.dir ? "–" : r.n + (r.dir > 0 ? "G" : "M");
    return '<div class="oyuncuKart">'+
      '<div class="ust">'+
        '<span class="face row'+(pphoto(id)?" has":"")+'" style="background:'+col+'">'+
          (pphoto(id) ? '<img src="'+esc(pphoto(id))+'" alt="">'
                      : '<span class="initial">'+esc(pname(id).charAt(0).toLocaleUpperCase("tr"))+'</span>')+
        '</span>'+
        '<span class="ad" style="color:'+col+'">'+esc(pname(id))+'</span>'+
      '</div>'+
      '<div class="buyuk" style="color:'+col+'">'+pct+'<span style="font-size:20px; color:var(--faint)">%</span></div>'+
      '<div class="oran"><i style="width:'+pct+'%; background:'+col+'"></i></div>'+
      '<div class="alt">'+
        '<span>Oynadı<b>'+o+'</b></span>'+
        '<span>Galibiyet<b>'+r.w+'</b></span>'+
        '<span>Yenilgi<b>'+r.l+'</b></span>'+
        '<span>Seri<b style="color:'+(r.dir>0?"#4ef0a0":(r.dir<0?"#ff6a6a":"var(--faint)"))+'">'+seri+'</b></span>'+
      '</div>'+
    '</div>';
  }).join("");
}

function renderCizgi(c){
  var ids = S.players.map(function(p){ return p.id; });
  if(!ids.length){ $("cizgi").innerHTML = ""; return; }
  var bas = {};
  ids.forEach(function(id){ bas[id] = 0; });
  c.list.forEach(function(r){ bas[r.a] = (bas[r.a]||0) + r.base[0]; bas[r.b] = (bas[r.b]||0) + r.base[1]; });
  var seri = {};
  ids.forEach(function(id){ seri[id] = [bas[id]]; });
  c.ms.forEach(function(m){
    ids.forEach(function(id){ var a = seri[id]; a.push(a[a.length-1] + (m.w === id ? 1 : 0)); });
  });
  var n = c.ms.length, enBuyuk = 1;
  ids.forEach(function(id){ enBuyuk = Math.max(enBuyuk, seri[id][seri[id].length-1]); });
  var W = 640, H = 210, P = 26;
  function X(i){ return P + (n ? i/n : 0) * (W - P*2); }
  function Y(v){ return H - P - (v/enBuyuk) * (H - P*2); }
  var izgara = [0, 0.5, 1].map(function(f){
    var v = Math.round(enBuyuk*f);
    return '<line x1="'+P+'" y1="'+Y(v)+'" x2="'+(W-P)+'" y2="'+Y(v)+'" stroke="#17232a" stroke-width="1"/>'+
           '<text x="'+(P-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" fill="#455861" font-size="10" font-family="DM Mono, monospace">'+v+'</text>';
  }).join("");
  var yollar = ids.map(function(id){
    var pts = seri[id].map(function(v,i){ return X(i).toFixed(1)+","+Y(v).toFixed(1); }).join(" ");
    var sonY = Y(seri[id][seri[id].length-1]);
    return '<polyline points="'+pts+'" fill="none" stroke="'+pcol(id)+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
           '<circle cx="'+X(n).toFixed(1)+'" cy="'+sonY.toFixed(1)+'" r="3.5" fill="'+pcol(id)+'"/>';
  }).join("");
  $("cizgi").innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Zamanla toplam galibiyet">'+
    izgara + yollar +
    '<text x="'+P+'" y="'+(H-6)+'" fill="#455861" font-size="10" font-family="DM Mono, monospace">devir</text>'+
    '<text x="'+(W-P)+'" y="'+(H-6)+'" text-anchor="end" fill="#455861" font-size="10" font-family="DM Mono, monospace">bugün</text>'+
    '</svg>';
  $("cizgiLegend").innerHTML = ids.map(function(id){
    return '<span><i style="background:'+pcol(id)+'"></i>'+esc(pname(id))+'</span>';
  }).join("");
}

function renderH2H(c){
  if(!c.list.length){ $("h2h").innerHTML = '<p class="empty">Kapışma yok.</p>'; return; }
  $("h2h").innerHTML = c.list.map(function(r, i){
    var an = pname(r.a), bn = pname(r.b), ac = pcol(r.a), bc = pcol(r.b);
    var t = Math.max(1, r.aw + r.bw);
    return '<button class="h2hSatir" data-git="'+(i+1)+'">'+
      '<div class="h2hUst">'+
        '<span class="h2hAd" style="color:'+ac+'"><i class="swatch" style="background:'+ac+'"></i>'+esc(an)+'</span>'+
        '<span class="h2hSkor"><span style="color:'+ac+'">'+r.aw+'</span>'+
          '<span style="color:var(--faint)"> – </span>'+
          '<span style="color:'+bc+'">'+r.bw+'</span></span>'+
        '<span class="h2hAd" style="color:'+bc+'">'+esc(bn)+'<i class="swatch" style="background:'+bc+'"></i></span>'+
      '</div>'+
      '<div class="h2hCubuk"><i style="width:'+(r.aw/t*100)+'%; background:'+ac+'"></i><i style="width:'+(r.bw/t*100)+'%; background:'+bc+'"></i></div>'+
      '<div class="h2hAlt">100\'e ' + Math.max(0, HEDEF-r.aw) + ' / ' + Math.max(0, HEDEF-r.bw) + ' galibiyet · ' + (r.aw+r.bw) + ' maç oynandı</div>'+
    '</button>';
  }).join("");
}

function renderStand(c){
  var ids = S.players.map(function(p){ return p.id; });
  if(!ids.length){ $("stand").innerHTML = '<tr><td colspan="6" class="empty">Oyuncu yok.</td></tr>'; return; }
  ids.sort(function(x,y){
    var a=c.rec[x], b=c.rec[y], ao=a.w+a.l, bo=b.w+b.l;
    return (b.w-a.w) || ((bo?b.w/bo:0)-(ao?a.w/ao:0));
  });
  $("stand").innerHTML = ids.map(function(id){
    var r=c.rec[id], o=r.w+r.l, pct=o?Math.round(r.w/o*100):0;
    var st = !r.dir ? '<span class="streak no">–</span>'
      : '<span class="streak '+(r.dir>0?"up":"dn")+'">'+r.n+(r.dir>0?"G":"M")+'</span>';
    return '<tr'+(id===me?' class="me"':'')+'>'+
      '<td><span class="nmcell">'+
        '<button class="face row'+(pphoto(id)?' has':'')+'" data-photo="'+esc(id)+'" style="background:'+pcol(id)+'" '+
          'title="Fotoğraf ekle / değiştir" aria-label="'+esc(pname(id))+' fotoğrafı">'+
          (pphoto(id) ? '<img src="'+esc(pphoto(id))+'" alt="">'
                      : '<span class="initial">'+esc(pname(id).charAt(0).toLocaleUpperCase("tr"))+'</span>')+
        '</button>'+esc(pname(id))+'</span></td>'+
      '<td>'+o+'</td><td>'+r.w+'</td><td>'+r.l+'</td><td>'+pct+'</td><td>'+st+'</td></tr>';
  }).join("");
}

function fmtWhen(t){
  var d=new Date(t), n=new Date();
  if(d.toDateString()===n.toDateString()) return d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"short"});
}
function renderFeed(c){
  if(!c.desc.length){
    $("feed").innerHTML = '<p class="empty">Henüz sayı yok. Yukarıdaki tuşlardan birine bas.</p>';
    return;
  }
  $("feed").innerHTML = c.desc.slice(0,30).map(function(m){
    var wn=pname(m.w), ln=pname(m.l);
    return '<div class="ev">'+
      '<div class="ev-t"><span style="color:'+pcol(m.w)+'">'+esc(wn)+'</span> <span class="beat">yendi</span> '+esc(ln)+'</div>'+
      '<div class="ev-w">'+fmtWhen(m.at)+(backend?'<button class="rm" data-rm="'+esc(m.id)+'" title="Sil" aria-label="Bu sayıyı sil">✕</button>':'')+'</div>'+
      '<div class="ev-talk">'+esc(feedFor(m,wn,ln))+'</div>'+
    '</div>';
  }).join("");

/* ---------- backend ---------- */
var backend = null;

function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c === "x" ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function sbBackend(sb){
  var subs = {pp_players:[], pp_matches:[], pp_rivs:[]};

  function pull(table){
    var q = sb.from(table).select("*");
    if(table === "pp_matches") q = q.order("at", {ascending:true}).limit(5000);
    return q.then(function(res){
      if(res.error){ console.warn(table, res.error.message); return; }
      var rows = res.data || [];
      var out;
      if(table === "pp_players"){
        out = rows.map(function(r){ return {id:r.id, name:r.name||"?", ord:r.ord||0, photo:r.photo||""}; })
                  .sort(function(a,b){ return a.ord-b.ord; });
      } else if(table === "pp_matches"){
        out = rows.map(function(r){ return {id:r.id, w:r.w, l:r.l, at:Number(r.at)||0}; })
                  .filter(function(m){ return m.w && m.l; });
      } else {
        out = {};
        rows.forEach(function(r){ out[r.id] = {a:r.a, b:r.b, baseA:r.base_a||0, baseB:r.base_b||0}; });
      }
      subs[table].forEach(function(f){ f(out); });
    });
  }

  ["pp_players","pp_matches","pp_rivs"].forEach(function(t){
    sb.channel("kd_"+t)
      .on("postgres_changes", {event:"*", schema:"public", table:t}, function(){ pull(t); })
      .subscribe();
  });
  // canlı bağlantı koparsa diye sessiz emniyet ağı
  setInterval(function(){ if(!document.hidden) pull("pp_matches"); }, 45000);

  function on(table){
    return function(cb){ subs[table].push(cb); pull(table); return function(){}; };
  }

  return {
    shared:true,
    onPlayers:on("pp_players"),
    onMatches:on("pp_matches"),
    onRivs:on("pp_rivs"),
    addPlayer:function(name){
      var id = slug(name) || ("o" + Date.now().toString(36));
      if(S.players.some(function(p){ return p.id === id; })) id += "-" + Math.random().toString(36).slice(2,5);
      return sb.from("pp_players").insert({id:id, name:name, ord:Date.now()}).then(function(r){
        if(r.error) throw r.error; return pull("pp_players");
      });
    },
    setPhoto:function(id, data){
      return sb.from("pp_players").update({photo:data}).eq("id", id).then(function(r){
        if(r.error) throw r.error; return pull("pp_players");
      });
    },
    scoreMany:function(w,l,n){
      var rows=[]; for(var i=0;i<n;i++) rows.push({id:uuid(), w:w, l:l, at:Date.now()+i});
      S.matches = S.matches.concat(rows); arrived = true; render();
      return sb.from("pp_matches").insert(rows).then(function(r){
        if(r.error){ var ids=rows.map(function(x){return x.id;}); S.matches=S.matches.filter(function(m){return ids.indexOf(m.id)<0;}); render(); throw r.error; }
      });
    },
    removeMany:function(ids){
      if(!ids.length) return Promise.resolve();
      var kept=S.matches; S.matches=S.matches.filter(function(m){return ids.indexOf(m.id)<0;}); render();
      return sb.from("pp_matches").delete().in("id", ids).then(function(r){ if(r.error){ S.matches=kept; render(); throw r.error; } });
    },
    setBase:function(key,a,b,baseA,baseB){
      return sb.from("pp_rivs").upsert({id:key, a:a, b:b, base_a:baseA, base_b:baseB}).then(function(r){ if(r.error) throw r.error; return pull("pp_rivs"); });
    },
    score:function(w,l){
      var row = {id:uuid(), w:w, l:l, at:Date.now()};
      S.matches = S.matches.concat([row]);   // önce ekranda
      arrived = true; render();
      return sb.from("pp_matches").insert(row).then(function(r){
        if(r.error){
          S.matches = S.matches.filter(function(m){ return m.id !== row.id; });
          render();
          throw r.error;
        }
      });
    },
    remove:function(id){
      var kept = S.matches;
      S.matches = S.matches.filter(function(m){ return m.id !== id; });
      render();
      return sb.from("pp_matches").delete().eq("id", id).then(function(r){
        if(r.error){ S.matches = kept; render(); throw r.error; }
      });
    }
  };
}

function localBackend(){
  var K="mt-kandavasi-v2", subs={p:[],m:[],r:[]};
  var d; try{ d = JSON.parse(localStorage.getItem(K)); }catch(e){}
  if(!d) d = {players:[], matches:[], rivs:{}};
  function save(){ try{ localStorage.setItem(K, JSON.stringify(d)); }catch(e){} }
  function fire(){
    subs.p.forEach(function(f){ f(d.players); });
    subs.m.forEach(function(f){ f(d.matches); });
    subs.r.forEach(function(f){ f(d.rivs); });
  }
  return {
    shared:false,
    onPlayers:function(cb){ subs.p.push(cb); cb(d.players); return function(){}; },
    onMatches:function(cb){ subs.m.push(cb); cb(d.matches); return function(){}; },
    onRivs:function(cb){ subs.r.push(cb); cb(d.rivs); return function(){}; },
    addPlayer:function(n){ d.players.push({id:slug(n)+"-"+Math.random().toString(36).slice(2,5), name:n}); save(); fire(); return Promise.resolve(); },
    setPhoto:function(id, data){
      d.players.forEach(function(x){ if(x.id===id) x.photo = data; });
      save(); fire(); return Promise.resolve();
    },
    scoreMany:function(w,l,n){ for(var i=0;i<n;i++) d.matches.push({id:"m"+Date.now()+i+Math.random().toString(36).slice(2,5), w:w, l:l, at:Date.now()+i}); save(); fire(); return Promise.resolve(); },
    removeMany:function(ids){ d.matches = d.matches.filter(function(m){ return ids.indexOf(m.id)<0; }); save(); fire(); return Promise.resolve(); },
    setBase:function(key,a,b,baseA,baseB){ d.rivs[key] = {a:a,b:b,baseA:baseA,baseB:baseB}; save(); fire(); return Promise.resolve(); },
    score:function(w,l){ d.matches.push({id:"m"+Date.now()+Math.random().toString(36).slice(2,5), w:w, l:l, at:Date.now()}); save(); fire(); return Promise.resolve(); },
    remove:function(id){ d.matches = d.matches.filter(function(m){ return m.id!==id; }); save(); fire(); return Promise.resolve(); }
  };
}

/* ---------- fotoğraf seç & kırp ---------- */
var crop = {id:null, img:null, scale:1, x:0, y:0, base:1};
var cvEl = $("cropcv"), cvCtx = cvEl.getContext("2d");

function cropDraw(){
  var N = cvEl.width;
  cvCtx.fillStyle = "#010305"; cvCtx.fillRect(0,0,N,N);
  if(!crop.img) return;
  var k = crop.base * crop.scale;
  var w = crop.img.width * k, h = crop.img.height * k;
  cvCtx.drawImage(crop.img, crop.x, crop.y, w, h);
}
function cropClamp(){
  var N = cvEl.width, k = crop.base * crop.scale;
  var w = crop.img.width * k, h = crop.img.height * k;
  crop.x = Math.min(0, Math.max(N - w, crop.x));
  crop.y = Math.min(0, Math.max(N - h, crop.y));
}
function openCrop(id, file){
  var img = new Image();
  img.onload = function(){
    var N = cvEl.width;
    crop.id = id; crop.img = img; crop.scale = 1;
    crop.base = Math.max(N/img.width, N/img.height);
    var w = img.width*crop.base, h = img.height*crop.base;
    crop.x = (N-w)/2; crop.y = Math.min(0, (N-h)*0.12);
    cropClamp(); cropDraw();
    $("cropzoom").value = 1;
    $("cropper").hidden = false;
  };
  img.onerror = function(){ window.alert("Bu görsel açılamadı."); };
  img.src = URL.createObjectURL(file);
}
function closeCrop(){
  $("cropper").hidden = true;
  if(crop.img && crop.img.src.indexOf("blob:") === 0) URL.revokeObjectURL(crop.img.src);
  crop.img = null; crop.id = null;
}
function saveCrop(){
  if(!crop.img || !crop.id) return;
  var OUT = 224, out = document.createElement("canvas");
  out.width = out.height = OUT;
  var g = out.getContext("2d");
  var r = OUT / cvEl.width;
  g.fillStyle = "#010305"; g.fillRect(0,0,OUT,OUT);
  var k = crop.base * crop.scale * r;
  g.drawImage(crop.img, crop.x*r, crop.y*r, crop.img.width*k, crop.img.height*k);
  var q = 0.74, data = out.toDataURL("image/jpeg", q);
  while(data.length > 170000 && q > 0.28){ q -= 0.12; data = out.toDataURL("image/jpeg", q); }
  var id = crop.id;
  closeCrop();
  Promise.resolve(backend.setPhoto(id, data)).catch(function(){
    window.alert("Fotoğraf kaydedilemedi, tekrar dene.");
  });
}
var lastFace = null;
function pickPhoto(id){
  lastFace = id;
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(f) openCrop(id, f);
  };
  inp.click();
}

(function(){
  var view = $("cropview"), drag = null;
  view.addEventListener("pointerdown", function(e){
    if(!crop.img) return;
    drag = {x:e.clientX, y:e.clientY, ox:crop.x, oy:crop.y};
    view.setPointerCapture(e.pointerId);
  });
  view.addEventListener("pointermove", function(e){
    if(!drag || !crop.img) return;
    var r = cvEl.width / view.clientWidth;
    crop.x = drag.ox + (e.clientX - drag.x) * r;
    crop.y = drag.oy + (e.clientY - drag.y) * r;
    cropClamp(); cropDraw();
  });
  view.addEventListener("pointerup", function(){ drag = null; });
  view.addEventListener("pointercancel", function(){ drag = null; });
  $("cropzoom").addEventListener("input", function(){
    if(!crop.img) return;
    var N = cvEl.width, old = crop.base * crop.scale;
    crop.scale = parseFloat(this.value) || 1;
    var neu = crop.base * crop.scale, f = neu / old;
    crop.x = N/2 - (N/2 - crop.x) * f;
    crop.y = N/2 - (N/2 - crop.y) * f;
    cropClamp(); cropDraw();
  });
  document.addEventListener("dragover", function(e){
    if(!e.dataTransfer) return;
    var types = e.dataTransfer.types;
    if(types && [].indexOf.call(types, "Files") >= 0){
      e.preventDefault();
      var t = e.target.closest && e.target.closest("[data-photo]");
      if(t) t.classList.add("drop");
    }
  });
  document.addEventListener("dragleave", function(e){
    var t = e.target.closest && e.target.closest("[data-photo]");
    if(t) t.classList.remove("drop");
  });
  document.addEventListener("drop", function(e){
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    var t = e.target.closest && e.target.closest("[data-photo]");
    if(t) t.classList.remove("drop");
    if(!f || f.type.indexOf("image/") !== 0 || !backend) return;
    var id = t ? t.getAttribute("data-photo") : lastFace;
    if(!id) return;
    e.preventDefault();
    lastFace = id;
    openCrop(id, f);
  });
  document.addEventListener("paste", function(e){
    if(!backend || !lastFace || !$("cropper").hidden) return;
    var items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(var i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf("image/") === 0){
        var f = items[i].getAsFile();
        if(f){ e.preventDefault(); openCrop(lastFace, f); }
        return;
      }
    }
  });
  $("cropcancel").addEventListener("click", closeCrop);
  $("cropsave").addEventListener("click", saveCrop);
  $("cropper").addEventListener("click", function(e){ if(e.target === this) closeCrop(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !$("cropper").hidden) closeCrop();
  });
})();

  var r = aktif && c.pairs[aktif]; if(!r) return;
  var an = pname(r.a), bn = pname(r.b), ac = pcol(r.a), bc = pcol(r.b);
  $("kAdA").textContent = an; $("kAdA").style.color = ac;
  $("kAdB").textContent = bn; $("kAdB").style.color = bc;
  $("kSkorA").textContent = r.aw; $("kSkorB").textContent = r.bw;
  $("kPlusA").textContent = "+ " + an; $("kPlusA").style.color = ac; $("kPlusA").style.borderColor = ac;
  $("kPlusB").textContent = "+ " + bn; $("kPlusB").style.color = bc; $("kPlusB").style.borderColor = bc;
  $("kPlusA").disabled = $("kPlusB").disabled = !backend;
  $("kEksiA").disabled = !backend || r.aw <= 0; $("kEksiB").disabled = !backend || r.bw <= 0;
  $("kUndo").disabled = !backend || !r.ms.length;
  $("kYol").textContent = "100'e " + Math.max(0, HEDEF - r.aw) + " · " + Math.max(0, HEDEF - r.bw);
}

/* duvar panosu: salonun arka duvarındaki lig tablosu */
function duvarCiz(cv, c){
  var g = cv.getContext("2d"), W = cv.width, Hh = cv.height;
  g.fillStyle = "#0b1015"; g.fillRect(0, 0, W, Hh);
  g.strokeStyle = "rgba(255,255,255,.08)"; g.lineWidth = 6; g.strokeRect(20, 20, W-40, Hh-40);
  g.fillStyle = "#ff6a1f"; g.font = "800 92px 'Big Shoulders Display', 'Arial Narrow', sans-serif"; g.textBaseline = "top"; g.textAlign = "left";
  g.fillText("KAN DAVASI", 70, 52);
  g.fillStyle = "rgba(255,255,255,.45)"; g.font = "500 28px 'DM Mono', monospace";
  g.fillText("HER KAPIŞMA 100 GALİBİYETE · İLK VARAN DAVAYI KAPATIR", 74, 156);
  var ids = S.players.map(function(p){ return p.id; }); if(!ids.length) return;
  // oyuncu sütunları
  var colW = Math.min(560, (W - 140) / ids.length);
  ids.forEach(function(id, i){
    var r = c.rec[id] || {w:0,l:0,n:0,dir:0}, o = r.w + r.l, pct = o ? Math.round(r.w/o*100) : 0, col = pcol(id), x = 70 + i*colW;
    g.fillStyle = col; g.font = "700 54px 'Big Shoulders Display', sans-serif"; g.fillText(pname(id).toLocaleUpperCase("tr"), x, 230);
    g.fillStyle = "#f4f7f8"; g.font = "800 150px 'Big Shoulders Display', sans-serif"; g.fillText(pct + "", x, 285);
    var pw = g.measureText(pct + "").width;
    g.fillStyle = "rgba(255,255,255,.4)"; g.font = "600 40px 'Big Shoulders Display', sans-serif"; g.fillText("%", x + pw + 8, 300);
    g.fillStyle = "rgba(255,255,255,.14)"; g.fillRect(x, 445, colW - 60, 10);
    g.fillStyle = col; g.fillRect(x, 445, (colW - 60) * pct/100, 10);
    g.fillStyle = "rgba(255,255,255,.6)"; g.font = "500 26px 'DM Mono', monospace";
    var seri = !r.dir ? "–" : r.n + (r.dir > 0 ? "G" : "M");
    g.fillText(r.w + " GALİBİYET   " + r.l + " YENİLGİ   SERİ " + seri, x, 470);
  });
  // kapışma çubukları
  var y = 560;
  c.list.forEach(function(r){
    var an = pname(r.a), bn = pname(r.b), ac = pcol(r.a), bc = pcol(r.b), t = Math.max(1, r.aw + r.bw);
    g.font = "700 44px 'Big Shoulders Display', sans-serif"; g.textAlign = "left"; g.fillStyle = ac; g.fillText(an.toLocaleUpperCase("tr"), 70, y);
    g.textAlign = "right"; g.fillStyle = bc; g.fillText(bn.toLocaleUpperCase("tr"), W - 70, y);
    g.textAlign = "center"; g.fillStyle = "#f4f7f8"; g.font = "800 60px 'Big Shoulders Display', sans-serif"; g.fillText(r.aw + "  –  " + r.bw, W/2, y - 8);
    g.fillStyle = "rgba(255,255,255,.1)"; g.fillRect(70, y + 62, W - 140, 16);
    g.fillStyle = ac; g.fillRect(70, y + 62, (W - 140) * r.aw / t, 16);
    g.fillStyle = bc; g.fillRect(70 + (W - 140) * r.aw / t, y + 62, (W - 140) * r.bw / t, 16);
    y += 130;
  });
  g.textAlign = "left";
}

/* ---------- çizim ---------- */
var pending = false;
function render(){
  if(pending) return; pending = true;
  Promise.resolve().then(function(){ pending = false; try{ draw(); }catch(e){ console.error("render", e); } });
}
function draw(){
  var c = compute();
  var fresh = [];
  c.ms.forEach(function(m){ if(!seen[m.id]){ seen[m.id] = 1; if(primed) fresh.push(m); } });
  if(arrived) primed = true;

  sonListe = c.list;
  if(aktif && !c.pairs[aktif]) aktif = null;
  if(window.SALON && SALON.ok){
    SALON.setData(c.list.map(function(r){
      return { key:r.key, an:pname(r.a), bn:pname(r.b), ac:pcol(r.a), bc:pcol(r.b), aw:r.aw, bw:r.bw,
               last5: r.ms.slice(-5).reverse().map(function(m){ return pcol(m.w); }) };
    }));
    SALON.setWall(function(cv){ duvarCiz(cv, c); });
  }
  fresh.forEach(function(m){
    var key = key2(m.w, m.l), r = c.pairs[key]; if(!r) return;
    var winIsA = m.w === r.a, wn = pname(m.w), ln = pname(m.l);
    var patlat = function(mac){
      var alt = "MAÇ " + wn.toLocaleUpperCase("tr") + (mac && mac.w ? " · " + mac.w + "–" + mac.l : "");
      mansetGoster(mansetFor(m, wn, ln), pcol(m.w), alt);
      if(window.SALON && SALON.ok) SALON.bubble(key, !winIsA, toastFor(m, wn, ln));
    };
    if(!(window.SALON && SALON.ok && SALON.rally(key, winIsA, patlat))) patlat();
  });

  hudSekmeler(c); hudKontrol(c);
  renderKartlar(c); renderCizgi(c); renderH2H(c); renderStand(c); renderFeed(c); renderDaily(c); renderNote(); renderSelect();
}

/* ---------- toplamı elle ayarla ---------- */
function toplamAyarla(key, pid, n){
  var c = compute(), r = c.pairs[key]; if(!r || !backend) return;
  var isA = pid === r.a, cur = isA ? r.aw : r.bw, opp = isA ? r.b : r.a, diff = n - cur;
  if(diff === 0) return;
  if(diff > 0){ backend.scoreMany(pid, opp, diff).catch(function(){ bildir("Kaydedilemedi, tekrar dene."); }); return; }
  var mine = r.ms.filter(function(m){ return m.w === pid; }).slice(diff);
  var kalan = -diff - mine.length;
  backend.removeMany(mine.map(function(m){ return m.id; })).then(function(){
    if(kalan > 0) return backend.setBase(key, r.a, r.b, Math.max(0, r.base[0] - (isA ? kalan : 0)), Math.max(0, r.base[1] - (isA ? 0 : kalan)));
  }).catch(function(){ bildir("Değiştirilemedi, tekrar dene."); });
}
function skorSor(key, pid){
  var c = compute(), r = c.pairs[key]; if(!r) return;
  var cur = pid === r.a ? r.aw : r.bw;
  var v = window.prompt(pname(pid) + " için yeni toplam galibiyet:", String(cur));
  if(v === null) return;
  var n = parseInt(v, 10);
  if(isNaN(n) || n < 0 || n > 999){ bildir("0–999 arası bir sayı yaz."); return; }
  toplamAyarla(key, pid, n);
}

/* ---------- olaylar ---------- */
function gorunum(key){
  aktif = key || null;
  if(window.SALON && SALON.ok) SALON.goto(aktif);
  var c = compute(); hudSekmeler(c); hudKontrol(c);
}
if(window.SALON){ /* modül daha sonra gelir; olayları ready'de bağlıyoruz */ }
addEventListener("salon-ready", function(){
  $("yukleme").classList.add("bitti");
  SALON.on("pick", function(key){ gorunum(key); });
  SALON.on("paddle", function(d){ if(!backend) return; var r = compute().pairs[d.key]; if(!r) return; var w = d.side === "a" ? r.a : r.b, l = d.side === "a" ? r.b : r.a; backend.score(w, l); });
  SALON.on("view", function(v){ aktif = v; var c = compute(); hudSekmeler(c); hudKontrol(c); });
  var sesTercih = null; try{ sesTercih = localStorage.getItem("mt-ses"); }catch(e){}
  SALON.sound(sesTercih !== "0"); $("ses").textContent = sesTercih !== "0" ? "🔊" : "🔇";
  render();
});
setTimeout(function(){ if(!(window.SALON && SALON.ok)){ $("yukleme").querySelector("p").textContent = "3B açılamadı · 2B sürüme geçiliyor"; setTimeout(function(){ location.href = "2d.html"; }, 1400); } }, 25000);

var lastTap = 0;
document.addEventListener("click", function(ev){
  var t = ev.target;
  var sek = t.closest("[data-view]"); if(sek){ gorunum(sek.dataset.view || null); return; }
  var git = t.closest("[data-git]"); if(git){ var i = parseInt(git.getAttribute("data-git"),10); kapat(); gorunum(i > 0 && sonListe[i-1] ? sonListe[i-1].key : null); return; }
  if(t.closest("#geri") || t.closest("#logo")){ ev.preventDefault(); gorunum(null); return; }
  if(t.closest("#istat")){ ac(); return; }
  if(t.closest("#perde")){ kapat(); return; }
  if(t.closest("#ses")){ var on = $("ses").textContent !== "🔊"; SALON.sound(on); $("ses").textContent = on ? "🔊" : "🔇"; try{ localStorage.setItem("mt-ses", on ? "1" : "0"); }catch(e){} return; }
  if(t.closest("#ikiB")){ location.href = "2d.html"; return; }
  var r = aktif && compute().pairs[aktif];
  if(r && backend){
    var now = Date.now();
    if(t.closest("#kPlusA") || t.closest("#kPlusB")){ if(now - lastTap < 350) return; lastTap = now; var a = !!t.closest("#kPlusA"); backend.score(a ? r.a : r.b, a ? r.b : r.a); return; }
    if(t.closest("#kEksiA")){ toplamAyarla(aktif, r.a, r.aw - 1); return; }
    if(t.closest("#kEksiB")){ toplamAyarla(aktif, r.b, r.bw - 1); return; }
    if(t.closest("#kSkorA")){ skorSor(aktif, r.a); return; }
    if(t.closest("#kSkorB")){ skorSor(aktif, r.b); return; }
    if(t.closest("#kUndo")){ if(r.ms.length){ var last = r.ms[r.ms.length-1]; if(window.confirm(pname(last.w)+" sayısı geri alınsın mı?")) backend.remove(last.id); } return; }
  }
  var ph = t.closest("[data-photo]"); if(ph){ if(backend) pickPhoto(ph.getAttribute("data-photo")); return; }
  var rm = t.closest("[data-rm]"); if(rm){ if(backend && window.confirm("Bu kayıt silinsin mi?")) backend.remove(rm.getAttribute("data-rm")); return; }
  if(t.id === "addp"){
    var name = (window.prompt("Oyuncu adı:")||"").trim(); if(!name || !backend) return;
    if(S.players.some(function(p){ return p.name.toLocaleLowerCase("tr")===name.toLocaleLowerCase("tr"); })) return;
    backend.addPlayer(name); return;
  }
  if(t.id === "backup"){
    var stamp = new Date().toISOString().slice(0,10);
    try{ saveFile("kandavasi-"+stamp+".json", backupJSON()); saveFile("kandavasi-"+stamp+".txt", backupText()); say("yedek indirildi"); }catch(e){ say("indirilemedi, tekrar dene"); }
    return;
  }
});
function ac(){ $("cekmece").classList.add("acik"); $("perde").classList.add("acik"); }
function kapat(){ $("cekmece").classList.remove("acik"); $("perde").classList.remove("acik"); }
addEventListener("keydown", function(e){
  if(e.target.matches("input,select,textarea")) return;
  if(e.key === "Escape"){ kapat(); return; }
  var i = sonListe.findIndex(function(r){ return r.key === aktif; });
  if(e.key === "ArrowRight") gorunum(sonListe[Math.min(sonListe.length-1, i+1)] ? sonListe[Math.min(sonListe.length-1, i+1)].key : null);
  if(e.key === "ArrowLeft") gorunum(i > 0 ? sonListe[i-1].key : null);
});
$("me").addEventListener("change", function(){ me = this.value; try{ localStorage.setItem("mt-me", me); }catch(e){} render(); });

/* ---------- açılış ---------- */
render();
try{
  if(!window.supabase || !window.SB_URL) throw new Error("supabase yok");
  boot(sbBackend(window.supabase.createClient(window.SB_URL, window.SB_KEY, { auth:{persistSession:false}, realtime:{params:{eventsPerSecond:5}} })));
}catch(e){
  console.warn("Supabase'e bağlanılamadı, yerel kayda düşülüyor:", e && e.message);
  boot(localBackend());
}

})();
</script>
